<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search Algorithms</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#ffffff; --tile:#f5f5f7; --ink:#111113; --off:#6e6e76; --stroke:#a1a1aa;
  --line:#e3e3e7; --hair:#ebebee; --grid:#e9e9ec; --seg:#f1f1f3;
  --now:#111113; --gold:#f5b301; --live:#1a8f6a;
  --map-lo:#f7f7f8; --map-hi:#b4b4bb;
  --vir:linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,select,input,a{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:56px 32px 48px}
@media (max-width:640px){.wrap{padding:32px 16px 40px}}

/* header */
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--seg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;border-radius:8px;background:transparent;padding:7px 14px;font-size:13px;font-weight:700;color:var(--off);cursor:pointer}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(17,17,19,.12)}
.seg.sm{border-radius:9px}
.seg.sm button{padding:6px 11px;font-size:12px;border-radius:7px}

/* play-all row */
.bar{margin-top:28px;padding-bottom:20px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.go{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 13px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.go svg{width:12px;height:12px;fill:#fff}
.go:hover{background:#2a2a2e}
.circle{width:36px;height:36px;flex:none;border:1px solid var(--line);border-radius:999px;background:#fff;display:grid;place-items:center;cursor:pointer}
.circle:hover{background:var(--tile)}
.circle.sm{width:32px;height:32px}
.circle svg{width:14px;height:14px}
.vr{width:1px;height:20px;background:var(--hair);margin:0 4px}
.lbl{display:inline-flex;align-items:center;gap:8px}
select{height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 6px;font-size:12px;font-weight:700;cursor:pointer}
.clock{font-variant-numeric:tabular-nums;min-width:120px}
.legend{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ramp{width:72px;height:5px;border-radius:999px;background:var(--vir)}
.ring{width:10px;height:10px;border-radius:50%;border:2px solid var(--now)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.dia{width:8px;height:8px;border:1.5px solid var(--ink);transform:rotate(45deg)}

/* grid of cards */
.grid{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:28px;row-gap:40px}
.grid.rot{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
@media (max-width:520px){.grid.rot{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.tile{position:relative;background:var(--tile);border-radius:14px;overflow:hidden}
.tile.two{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;padding-right:10px}
@media (max-width:520px){.tile.two{grid-template-columns:1fr;padding:0 10px 10px 0}}
.exp{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 1px 3px rgba(17,17,19,.14);display:grid;place-items:center;cursor:pointer;z-index:1}
.exp svg{width:13px;height:13px}
canvas.gl{display:block;width:100%;cursor:grab;touch-action:none}
canvas.gl:active{cursor:grabbing}
canvas.plot2d{display:block;width:100%}
.meta{display:flex;align-items:baseline;gap:10px;padding:0 2px}
.meta h2{margin:0;font-size:15px;font-weight:700}
.ttl{border:0;background:none;padding:0;font-size:15px;font-weight:700;cursor:pointer;text-align:left}
.ttl:hover{text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--stroke)}
.tag.live::before{background:var(--live);border-color:var(--live)}
.time{margin-left:auto;font-size:12.5px;font-variant-numeric:tabular-nums}
.st{display:flex;flex-wrap:wrap;gap:4px 16px;padding:0 2px;font-size:12.5px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;gap:12px;padding:0 2px}
.ctl select.bare{border:0;background:transparent;height:28px}
.pbtn{width:32px;height:32px;flex:none;border:1px solid var(--line);border-radius:999px;background:#fff;display:grid;place-items:center;cursor:pointer}
.pbtn:hover{background:var(--tile)}
.pbtn svg{width:11px;height:11px;fill:var(--ink)}
.pbtn.big{width:40px;height:40px;border:0;background:var(--ink)}
.pbtn.big:hover{background:#2a2a2e}
.pbtn.big svg{width:13px;height:13px;fill:#fff}

/* slider: plain black progress on a light track */
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:3px;border-radius:999px;margin:0;cursor:pointer;
  background:linear-gradient(90deg,var(--ink) var(--p,100%),var(--line) var(--p,100%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:1.5px solid var(--ink)}
input[type=range]::-moz-range-track{background:transparent}

/* expanded view */
.focus{margin-top:24px;display:grid;gap:20px}
.fhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.back:hover{background:var(--tile)}
.back svg{width:13px;height:13px}
.fhead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.nav{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.fbody{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.fbody{grid-template-columns:1fr}}
.fside{display:flex;flex-direction:column;gap:20px;min-width:0}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ptile{background:var(--tile);border-radius:16px;padding:14px 12px 8px}
.ptile p{margin:0 0 6px 4px;font-size:12px;font-weight:700}
.ptile canvas{display:block;width:100%}
.stats{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.stats div{background:#fff;padding:16px 18px;min-width:0}
.stats dt{font-size:12px}
.stats dd{margin:6px 0 0;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.stats dd{font-size:19px}}
.fctl{display:flex;align-items:center;gap:14px}

.note{margin:48px 0 0;padding-top:16px;border-top:1px solid var(--hair);font-size:12px}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FONT = 'Arial, Helvetica, sans-serif';
const ICON = { play:'<svg viewBox="0 0 12 12"><path d="M2.5 1.5v9l7.5-4.5z"/></svg>', pause:'<svg viewBox="0 0 12 12"><path d="M2.5 1.5h2.6v9H2.5zm4.4 0h2.6v9H6.9z"/></svg>',
  expand:'<svg viewBox="0 0 16 16" fill="none" stroke="#111113" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4"/><path d="M13.5 2.5 9 7"/><path d="M6.5 13.5h-4v-4"/><path d="M2.5 13.5 7 9"/></svg>' };
function viridis(t){ t=Math.max(0,Math.min(1,t));
  const c0=[0.2777,0.0054,0.3341],c1=[0.1051,1.4046,1.3846],c2=[-0.3309,0.2148,0.0951],c3=[-4.6342,-5.7991,-19.3324],c4=[6.2283,14.1799,56.6906],c5=[4.7764,-13.7451,-65.3530],c6=[-5.4355,4.6459,26.3124];
  return [0,1,2].map(i=>Math.max(0,Math.min(1,c0[i]+t*(c1[i]+t*(c2[i]+t*(c3[i]+t*(c4[i]+t*(c5[i]+t*c6[i])))))))); }
const rgb = a => `rgb(${a.map(x=>Math.round(x*255)).join(',')})`;
const fmtTime = s => { s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}h ${String(m).padStart(2,'0')}m` : `${m}:${String(x).padStart(2,'0')}`; };
const SPEED_OPTS = '<option value="1">1×</option><option value="4">4×</option><option value="16" selected>16×</option><option value="64">64×</option><option value="256">256×</option>';

// ---------- runs ----------
const POS = [
  {key:'sweep', name:'Full sweep', live:true}, {key:'c2f', name:'Coarse-to-fine', live:true},
  {key:'bo', name:'Bayesian optimisation', live:false}, {key:'ap', name:'Adaptive pattern search', live:false},
  {key:'greedy', name:'Greedy', live:false}, {key:'random', name:'Random walk', live:false} ];
const ROT = [
  {key:'c2f', name:'Coarse-to-fine', live:true}, {key:'lobing', name:'Sequential lobing', live:true},
  {key:'bo', name:'Bayesian optimisation', live:true}, {key:'track', name:'Continuous tracking', live:true},
  {key:'sweep', name:'Full angle sweep', live:true, tag:'No SNR'} ];
function buildPosRun(key){ const P=D[key].path, dt=D[key].dt; let t=0; return P.map((p,i)=>{ t+=dt[i]; return {x:p[0],y:p[1],z:p[2],s:p[3],T:t}; }); }
function buildRotRun(key){ const r=D.rot; let t=0;
  if(key==='track') return r.track.map(a=>({p:a[1],t:a[2],s:a[3],T:a[0]}));
  if(key==='sweep') return r.sweep.map(a=>{ t+=r.dt.sweep; return {p:a[0],t:a[1],s:null,T:t}; });
  return r[key].map(a=>{ t+=r.dt[key]; return key==='lobing'?{p:a[0],t:a[1],s:a[2],c:a[3],T:t}:{p:a[0],t:a[1],s:a[2],T:t}; }); }
const TB = D.best;
const tagText = d => d.tag || (d.live ? 'Live' : 'Replay');

// ---------- shared orbit ----------
const orbit = { pos:{az:-0.75, el:0.42, dist:102, ty:-5}, rot:{az:-0.75, el:0.3, dist:40, ty:3.5} };
function setCam(cam, which){ const o=orbit[which];
  cam.position.set(o.dist*Math.cos(o.el)*Math.sin(o.az), o.ty+o.dist*Math.sin(o.el), o.dist*Math.cos(o.el)*Math.cos(o.az)); cam.lookAt(0,o.ty,0); }
const cards = { pos:[], rot:[] };
let tab='pos', focus=null;

function label(text, size){
  const cv=document.createElement('canvas'), g=cv.getContext('2d'), fs=48;
  g.font=`bold ${fs}px ${FONT}`; const w=Math.ceil(g.measureText(text).width)+16; cv.width=w; cv.height=fs+16;
  g.font=`bold ${fs}px ${FONT}`; g.fillStyle=css('--ink'); g.textBaseline='middle'; g.fillText(text,8,cv.height/2);
  const tex=new THREE.CanvasTexture(cv); tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false})); sp.scale.set(size*w/cv.height,size,1); return sp; }
function makeRenderer(canvas){ const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); r.setPixelRatio(Math.min(2,window.devicePixelRatio||1)); return r; }
function fit(renderer, canvas, cam, aspect){ const w=canvas.clientWidth; if(!w) return false; const h=Math.round(w*aspect);
  if(canvas._w!==w){ renderer.setSize(w,h,false); canvas.style.height=h+'px'; cam.aspect=w/h; cam.updateProjectionMatrix(); canvas._w=w; } return true; }
function dragOrbit(canvas, whichFn){ let on=false, px=0, py=0;
  canvas.addEventListener('pointerdown',e=>{ on=true; px=e.clientX; py=e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove',e=>{ const which=whichFn(); if(!on||!which) return; const o=orbit[which];
    o.az-=(e.clientX-px)*0.01; o.el=Math.max(-0.1,Math.min(1.35,o.el+(e.clientY-py)*0.01)); px=e.clientX; py=e.clientY; cards[which].forEach(c=>c.dirty=true); });
  canvas.addEventListener('pointerup',()=>on=false); canvas.addEventListener('pointercancel',()=>on=false); }

// ---------- card shell ----------
function shell(grid, def, kind){
  const el=document.createElement('article'); el.className='card';
  el.innerHTML=`<div class="tile ${kind==='rot'?'two':''}"><button class="exp" aria-label="Expand ${def.name}">${ICON.expand}</button>
      <canvas class="gl" aria-label="${def.name} 3D view"></canvas>${kind==='rot'?'<canvas class="plot2d" aria-label="'+def.name+' pan-tilt plot"></canvas>':''}</div>
    <div class="meta"><button class="ttl">${def.name}</button><span class="tag ${def.live?'live':''}">${tagText(def)}</span><span class="time"></span></div>
    <div class="st"></div>
    <div class="ctl"><button class="pbtn c-play" aria-label="Play">${ICON.play}</button><input type="range" class="c-scrub" min="0" value="0" aria-label="${def.name} progress"><select class="bare c-speed" aria-label="${def.name} speed">${SPEED_OPTS}</select></div>`;
  grid.appendChild(el); return el; }

function cardStats(c){ const n=c.k, now=n?c.run[n-1]:null;
  if(c.kind==='pos') return `<span><b>${n.toLocaleString()}</b> measurements</span><span><b>${c.best?c.best.s.toFixed(2):'–'}</b> dB best</span>`;
  return `<span><b>${n}</b> measurements</span><span><b>${now?`${now.p.toFixed(0)}° / ${now.t.toFixed(0)}°`:'–'}</b></span><span><b>${now&&now.s!=null?now.s.toFixed(1):'–'}</b> ${now&&now.s!=null?'dB':(c.def.key==='sweep'?'no SNR':'')}</span>`; }
function focusStats(c){ const n=c.k, N=c.run.length, now=n?c.run[n-1]:null; const cell=(t,v)=>`<div><dt>${t}</dt><dd>${v}</dd></div>`;
  if(c.kind==='pos') return cell('Measurements',`${n.toLocaleString()}`)+cell('Best SNR',c.best?c.best.s.toFixed(2)+' dB':'–')+cell('Gap to true best',c.best?(TB[3]-c.best.s).toFixed(2)+' dB':'–')+cell('Lab time',now?fmtTime(now.T):'0:00');
  return cell('Measurements',`${n}`)+cell('Pan / tilt',now?`${now.p.toFixed(0)}° / ${now.t.toFixed(0)}°`:'–')+cell('SNR now',now&&now.s!=null?now.s.toFixed(1)+' dB':(c.def.key==='sweep'?'Not saved':'–'))+cell('Lab time',now?fmtTime(now.T):'0:00'); }

// ---------- position ----------
const P3 = (x,y,z)=> new THREE.Vector3(x, z, -y);
function makePosCard(def, idx){
  const el=shell($('grid-pos'),def,'pos'), run=buildPosRun(def.key), N=run.length;
  const canvas=el.querySelector('canvas.gl'), renderer=makeRenderer(canvas);
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(38,1.2,0.1,500);
  const edge=new THREE.Color(css('--stroke'));
  scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(41,41,41)), new THREE.LineBasicMaterial({color:edge,transparent:true,opacity:.7})));
  const gh=new THREE.GridHelper(41,6,edge,edge); gh.position.y=-20.5; gh.material.transparent=true; gh.material.opacity=.3; scene.add(gh);
  [['X',[24,-20.5,20.5]],['Y',[-20.5,-20.5,-24]],['Z',[-20.5,24,20.5]],['Tx side',[0,-20.5,27]]].forEach(([t,p])=>{ const s=label(t,2.4); s.position.set(...p); scene.add(s); });
  const pos=new Float32Array(N*3), col=new Float32Array(N*3);
  run.forEach((p,i)=>{ const v=P3(p.x,p.y,p.z); pos.set([v.x,v.y,v.z],i*3); col.set(viridis((p.s-20)/30.5),i*3); });
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:N>3000?0.9:1.7, vertexColors:true})));
  const tbM=new THREE.Mesh(new THREE.OctahedronGeometry(1.9), new THREE.MeshBasicMaterial({color:new THREE.Color(css('--ink')),wireframe:true})); tbM.position.copy(P3(TB[0],TB[1],TB[2])); scene.add(tbM);
  const bestM=new THREE.Mesh(new THREE.SphereGeometry(1.2,16,12), new THREE.MeshBasicMaterial({color:new THREE.Color(css('--gold'))})); scene.add(bestM);
  const curM=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12), new THREE.MeshBasicMaterial({color:new THREE.Color(css('--now'))})); scene.add(curM);
  const trail=new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color:new THREE.Color(css('--now')),transparent:true,opacity:.5})); scene.add(trail);
  const card={kind:'pos',which:'pos',idx,def,el,run,canvas,renderer,scene,camera,aspect:0.82,k:N,playing:false,acc:0,dirty:true,best:null,speed:16,
    update(){ const n=this.k; geo.setDrawRange(0,n);
      let b=null; for(let i=0;i<n;i++) if(!b||run[i].s>b.s) b=run[i]; this.best=b;
      const now=n?run[n-1]:null;
      bestM.visible=!!b; if(b) bestM.position.copy(P3(b.x,b.y,b.z));
      curM.visible=!!now; if(now) curM.position.copy(P3(now.x,now.y,now.z));
      const tail=run.slice(Math.max(0,n-10),n).map(p=>P3(p.x,p.y,p.z)); trail.visible=def.key!=='sweep'&&tail.length>1; if(tail.length>1) trail.geometry.setFromPoints(tail);
      refreshUI(this); },
    prep(){} };
  wire(card); dragOrbit(canvas,()=>'pos'); return card; }

// ---------- gimbal ----------
function buildGimbal(){
  const g=new THREE.Group();
  const M=(c,r=.55,m=.15)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const plate=M(0x4a525d,.5,.3), brass=M(0xc9a227,.35,.8), silver=M(0xc3c9d0,.3,.85), servoM=M(0x3d63b0,.5,.1), bracketM=M(0x8a939e,.4,.6), camM=M(0x23282e,.5,.2);
  const cyl=(r,h,m)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,48),m);
  const lower=cyl(8,0.45,plate); lower.position.y=-4.5; g.add(lower);
  g.add(cyl(8,0.45,plate));
  for(const a of [0.785,2.356,3.927,5.498]){ const s=cyl(0.32,4.5,brass); s.position.set(6.6*Math.cos(a),-2.25,6.6*Math.sin(a)); g.add(s); }
  const baseServo=new THREE.Mesh(new THREE.BoxGeometry(4,3.4,2.1),servoM); baseServo.position.set(0,-2.3,0); g.add(baseServo);
  const pan=new THREE.Group(); pan.position.y=0.5; g.add(pan);
  const top=cyl(5.6,0.5,silver); top.position.y=0.25; pan.add(top);
  const tiltServo=new THREE.Mesh(new THREE.BoxGeometry(2.1,3.6,4),servoM); tiltServo.position.set(-4.3,2.3,0); pan.add(tiltServo);
  const ub=new THREE.Mesh(new THREE.BoxGeometry(6.6,0.35,2.6),bracketM); ub.position.set(0,0.7,0); pan.add(ub);
  for(const x of [-3.15,3.15]){ const s=new THREE.Mesh(new THREE.BoxGeometry(0.35,5.4,2.6),bracketM); s.position.set(x,3.3,0); pan.add(s); }
  const hub=cyl(0.55,0.5,brass); hub.rotation.z=Math.PI/2; hub.position.set(-3.5,5.6,0); pan.add(hub);
  const tilt=new THREE.Group(); tilt.position.set(0,5.6,0); pan.add(tilt);
  const box=new THREE.Mesh(new THREE.BoxGeometry(5.8,5.2,4.2),new THREE.MeshStandardMaterial({color:0xe8edf2,roughness:.4,transparent:true,opacity:.28,depthWrite:false})); box.position.set(0,2.0,0); tilt.add(box);
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry),new THREE.LineBasicMaterial({color:0x8a939e})); edges.position.copy(box.position); tilt.add(edges);
  const cam=new THREE.Mesh(new THREE.BoxGeometry(2.2,2.0,1.6),camM); cam.position.set(-1.1,1.4,0.6); tilt.add(cam);
  const lens=cyl(0.62,0.6,M(0x0d1014,.15,.6)); lens.rotation.x=Math.PI/2; lens.position.set(-1.1,1.4,1.65); tilt.add(lens);
  const ant=cyl(0.24,4.4,M(0x15181c,.7,0)); ant.position.set(1.6,2.2,0.6); tilt.add(ant);
  const antBase=cyl(0.42,0.6,M(0xd4a017,.4,.5)); antBase.position.set(1.6,-0.1,0.6); tilt.add(antBase);
  tilt.add(new THREE.ArrowHelper(new THREE.Vector3(0,0,1),new THREE.Vector3(-1.1,1.4,2.1),8,new THREE.Color(css('--now')).getHex(),1.5,0.85));
  return {group:g, pan, tilt}; }

function makeRotCard(def, idx){
  const el=shell($('grid-rot'),def,'rot'), run=buildRotRun(def.key);
  const canvas=el.querySelector('canvas.gl'), renderer=makeRenderer(canvas);
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(35,1,0.1,300);
  scene.add(new THREE.HemisphereLight(0xffffff,0x445566,0.95)); const dl=new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(20,30,25); scene.add(dl);
  const gm=buildGimbal(); scene.add(gm.group);
  for(const a of [-90,-45,0,45,90]){ const r=a*Math.PI/180; const lb=label((a>0?'+':'')+a+'°',1.3); lb.position.set(10.4*Math.sin(r),0.3,10.4*Math.cos(r)); scene.add(lb);
    const tk=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,1.2),new THREE.MeshBasicMaterial({color:new THREE.Color(css('--stroke'))})); tk.position.set(8.6*Math.sin(r),0.3,8.6*Math.cos(r)); tk.rotation.y=r; scene.add(tk); }
  const vals=run.filter(p=>p.s!=null).map(p=>p.s);
  const card={kind:'rot',which:'rot',idx,def,el,run,canvas,renderer,scene,camera,aspect:0.95,k:run.length,playing:false,acc:0,dirty:true,speed:16,
    lo:vals.length?Math.min(...vals):0, hi:vals.length?Math.max(...vals):1, plot:el.querySelector('canvas.plot2d'), curP:0, curT:0, tgtP:0, tgtT:0, best:null,
    update(){ const n=this.k, now=n?run[n-1]:null; this.tgtP=now?now.p:0; this.tgtT=now?now.t:0;
      let b=null; for(let i=0;i<n;i++) if(run[i].s!=null&&(!b||run[i].s>b.s)) b=run[i]; this.best=b;
      if(!focus) drawPlot(this.plot,this,0.95); refreshUI(this); },
    prep(){ gm.pan.rotation.y=this.curP*Math.PI/180; gm.tilt.rotation.x=-this.curT*Math.PI/180; },
    ease(){ const dp=this.tgtP-this.curP, dt=this.tgtT-this.curT; if(Math.abs(dp)<0.05&&Math.abs(dt)<0.05){ if(dp||dt){ this.curP=this.tgtP; this.curT=this.tgtT; this.dirty=true; } return; }
      this.curP+=dp*0.22; this.curT+=dt*0.22; this.dirty=true; } };
  card.curP=card.tgtP=run[run.length-1].p; card.curT=card.tgtT=run[run.length-1].t;
  wire(card); dragOrbit(canvas,()=>'rot'); return card; }

// ---------- 2D drawing ----------
function setup(cv, aspect){ const w=cv.clientWidth||280, h=Math.round(w*aspect), dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px'; }
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h); return {g,w,h}; }
function axes(g,w,h,xr,yr,xl,yl,tx,ty){ const L=36,R=6,T=6,B=30, pw=w-L-R, ph=h-T-B;
  const sx=v=>L+(v-xr[0])/(xr[1]-xr[0])*pw, sy=v=>T+ph-(v-yr[0])/(yr[1]-yr[0])*ph;
  g.strokeStyle=css('--grid'); g.lineWidth=1; g.fillStyle=css('--ink'); g.font=`11px ${FONT}`;
  g.textAlign='center'; for(const t of tx){ g.beginPath(); g.moveTo(sx(t),T); g.lineTo(sx(t),T+ph); g.stroke(); g.fillText(t,sx(t),T+ph+13); }
  g.textAlign='right'; for(const t of ty){ g.beginPath(); g.moveTo(L,sy(t)); g.lineTo(L+pw,sy(t)); g.stroke(); g.fillText(t,L-5,sy(t)+4); }
  g.textAlign='center'; g.fillText(xl,L+pw/2,h-3); g.save(); g.translate(10,T+ph/2); g.rotate(-Math.PI/2); g.fillText(yl,0,0); g.restore();
  return {sx,sy}; }
function drawPlot(cv, card, aspect){
  const {g,w,h}=setup(cv,aspect), run=card.run, n=card.k, key=card.def.key;
  const {sx,sy}=axes(g,w,h,[-100,100],[-36,36],'pan (°)','tilt (°)',[-90,-45,0,45,90],[-30,0,30]);
  g.setLineDash([3,4]); g.strokeStyle=css('--stroke'); g.beginPath(); g.rect(sx(-90),sy(30),sx(90)-sx(-90),sy(-30)-sy(30)); g.stroke(); g.setLineDash([]);
  const shown=run.slice(0,n), path=key==='lobing'?shown.filter(p=>p.c):shown, big=w>360;
  if(path.length>1){ g.strokeStyle=css('--stroke'); g.globalAlpha=.7; g.beginPath(); path.forEach((p,i)=>i?g.lineTo(sx(p.p),sy(p.t)):g.moveTo(sx(p.p),sy(p.t))); g.stroke(); g.globalAlpha=1; }
  shown.forEach(p=>{ const small=key==='lobing'&&!p.c; g.fillStyle=small?'#d4d4d8':(p.s==null?css('--stroke'):rgb(viridis((p.s-card.lo)/((card.hi-card.lo)||1))));
    g.beginPath(); g.arc(sx(p.p),sy(p.t),(small?2.4:4)*(big?1.4:1),0,7); g.fill(); });
  if(card.best){ g.fillStyle=css('--gold'); g.beginPath(); g.arc(sx(card.best.p),sy(card.best.t),big?7:5,0,7); g.fill(); }
  const now=n?run[n-1]:null; if(now){ g.strokeStyle=css('--now'); g.lineWidth=2; g.beginPath(); g.arc(sx(now.p),sy(now.t),big?10:7,0,7); g.stroke(); } }
function bgMap(g,sx,sy,grid){ const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
  const a=hex(css('--map-lo')), b=hex(css('--map-hi')), st=1.905;
  for(let r=0;r<21;r++) for(let c=0;c<21;c++){ const t=Math.max(0,Math.min(1,(grid[r][c]-20)/30.5)); g.fillStyle=`rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*t))})`;
    const x0=sx(-19.05+c*st-st/2), x1=sx(-19.05+c*st+st/2), y0=sy(-19.05+r*st+st/2), y1=sy(-19.05+r*st-st/2); g.fillRect(x0,y0,x1-x0+0.6,y1-y0+0.6); } }
function drawMap(cv, card, A, B, grid, yl){
  const {g,w,h}=setup(cv,1.0), t=[-15,0,15];
  const {sx,sy}=axes(g,w,h,[-20.5,20.5],[-20.5,20.5],'X (cm)',yl,t,t); bgMap(g,sx,sy,grid);
  const n=card.k, run=card.run, rad=n>3000?1.6:2.6;
  for(let i=0;i<n;i++){ const p=run[i]; g.fillStyle=rgb(viridis((p.s-20)/30.5)); g.beginPath(); g.arc(sx(p[A]),sy(p[B]),rad,0,7); g.fill(); }
  const tail=run.slice(Math.max(0,n-12),n); if(tail.length>1&&card.def.key!=='sweep'){ g.strokeStyle=css('--now'); g.globalAlpha=.45; g.lineWidth=1.2; g.beginPath(); tail.forEach((p,i)=>i?g.lineTo(sx(p[A]),sy(p[B])):g.moveTo(sx(p[A]),sy(p[B]))); g.stroke(); g.globalAlpha=1; }
  const tb={x:TB[0],y:TB[1],z:TB[2]}; g.save(); g.translate(sx(tb[A]),sy(tb[B])); g.rotate(Math.PI/4); g.strokeStyle=css('--ink'); g.lineWidth=1.5; g.strokeRect(-4.5,-4.5,9,9); g.restore();
  if(card.best){ g.fillStyle=css('--gold'); g.strokeStyle='#fff'; g.lineWidth=1.5; g.beginPath(); g.arc(sx(card.best[A]),sy(card.best[B]),5,0,7); g.fill(); g.stroke(); }
  const now=n?run[n-1]:null; if(now){ g.strokeStyle=css('--now'); g.lineWidth=2; g.beginPath(); g.arc(sx(now[A]),sy(now[B]),7,0,7); g.stroke(); } }
function drawSpark(cv, card){
  const {g,w,h}=setup(cv, Math.max(0.09, 90/(cv.clientWidth||900))), run=card.run, n=card.k, track=card.def.key==='track';
  const vals=run.map(p=>p.s); if(vals.every(v=>v==null)){ g.fillStyle=css('--ink'); g.font=`12px ${FONT}`; g.fillText('SNR not saved for this run',4,h/2); return; }
  let b=-Infinity; const line=track?vals:vals.map(v=>{ if(v!=null&&v>b) b=v; return b===-Infinity?null:b; });
  const fin=line.filter(v=>v!=null), lo=Math.min(...fin), hi=Math.max(...fin, card.kind==='pos'?TB[3]:-Infinity);
  const X=i=>36+i/((run.length-1)||1)*(w-42), Y=v=>h-8-(v-lo)/((hi-lo)||1)*(h-16);
  g.fillStyle=css('--ink'); g.font=`11px ${FONT}`; g.textAlign='right'; g.fillText(hi.toFixed(1),32,12); g.fillText(lo.toFixed(1),32,h-6);
  if(card.kind==='pos'){ g.setLineDash([3,3]); g.strokeStyle=css('--stroke'); g.beginPath(); g.moveTo(36,Y(TB[3])); g.lineTo(w-6,Y(TB[3])); g.stroke(); g.setLineDash([]); }
  const trace=(arr,color,lw)=>{ g.strokeStyle=color; g.lineWidth=lw; g.beginPath(); let s=false; arr.forEach((v,i)=>{ if(v==null) return; s?g.lineTo(X(i),Y(v)):(g.moveTo(X(i),Y(v)),s=true); }); g.stroke(); };
  trace(line,'#d4d4d8',1.5);
  const gr=g.createLinearGradient(36,0,w-6,0); [0.05,0.3,0.55,0.8,1].forEach(t=>gr.addColorStop((t-0.05)/0.95,rgb(viridis(t)))); trace(line.slice(0,n),gr,2.6); }

// ---------- UI sync ----------
const setP = (inp,k,N)=>{ inp.value=k; inp.style.setProperty('--p',(100*k/(N||1))+'%'); };
function refreshUI(card){ const el=card.el, N=card.run.length, now=card.k?card.run[card.k-1]:null;
  el.querySelector('.st').innerHTML=cardStats(card); el.querySelector('.time').textContent=now?fmtTime(now.T):'0:00';
  setP(el.querySelector('.c-scrub'),card.k,N);
  const pb=el.querySelector('.c-play'); pb.innerHTML=card.playing?ICON.pause:ICON.play; pb.setAttribute('aria-label',card.playing?'Pause':'Play');
  card.dirty=true; if(focus===card) refreshFocus(); }
function refreshFocus(){ const c=focus; if(!c) return;
  $('fstats').innerHTML=focusStats(c); $('fscrub').max=c.run.length; setP($('fscrub'),c.k,c.run.length); $('fspeed').value=c.speed;
  $('fplay').innerHTML=c.playing?ICON.pause:ICON.play; $('fplay').setAttribute('aria-label',c.playing?'Pause':'Play');
  if(c.kind==='pos'){ drawMap($('fm1'),c,'x','y',D.bg_xy,'Y (cm)'); drawMap($('fm2'),c,'x','z',D.bg_xz,'Z (cm)'); }
  else drawPlot($('fm3'),c,0.6);
  drawSpark($('fspark'),c); }
function setPlaying(card, on){ stopGlobal(); if(on&&card.k>=card.run.length) card.k=0; card.playing=on; card.acc=0; card.update(); }
function wire(card){ const el=card.el; el.querySelector('.c-scrub').max=card.run.length;
  el.querySelector('.c-play').onclick=()=>setPlaying(card,!card.playing);
  el.querySelector('.c-scrub').oninput=e=>{ stopGlobal(); card.playing=false; card.k=Number(e.target.value); card.update(); };
  el.querySelector('.c-speed').onchange=e=>{ card.speed=Number(e.target.value); };
  el.querySelector('.exp').onclick=()=>openFocus(card); el.querySelector('.ttl').onclick=()=>openFocus(card);
  card.update(); }

// ---------- expanded view ----------
const fcanvas=$('fgl'); let frenderer=null; const fcam=new THREE.PerspectiveCamera(38,1.3,0.1,500);
dragOrbit(fcanvas,()=>focus&&focus.which);
function openFocus(card){ if(!frenderer) frenderer=makeRenderer(fcanvas);
  focus=card; $('focus').hidden=false; $('grid-'+tab).hidden=true;
  $('fname').textContent=card.def.name; const t=$('ftag'); t.className='tag'+(card.def.live?' live':''); t.textContent=tagText(card.def);
  $('fcount').textContent=`${card.idx+1} of ${cards[tab].length}`;
  const pos=card.kind==='pos'; $('fmaps').hidden=!pos; $('fpt').hidden=pos;
  $('fsc').textContent=card.def.key==='track'?'SNR over time':'Best SNR so far';
  fcanvas._w=null; card.dirty=true; refreshFocus(); window.scrollTo({top:0,behavior:'smooth'}); }
function closeFocus(){ if(!focus) return; const was=focus; focus=null; $('focus').hidden=true; $('grid-'+tab).hidden=false;
  cards[tab].forEach(c=>{ c.canvas._w=null; c.dirty=true; if(c.kind==='rot') drawPlot(c.plot,c,0.95); }); was.el.scrollIntoView({block:'center'}); }
function stepFocus(d){ const list=cards[tab], i=(focus.idx+d+list.length)%list.length; openFocus(list[i]); }
$('fback').onclick=closeFocus; $('fprev').onclick=()=>stepFocus(-1); $('fnext').onclick=()=>stepFocus(1);
$('fplay').onclick=()=>setPlaying(focus,!focus.playing);
$('fscrub').oninput=e=>{ stopGlobal(); focus.playing=false; focus.k=Number(e.target.value); focus.update(); };
$('fspeed').innerHTML=SPEED_OPTS; $('fspeed').onchange=e=>{ focus.speed=Number(e.target.value); focus.el.querySelector('.c-speed').value=e.target.value; };
document.addEventListener('keydown',e=>{ if(!focus||['INPUT','SELECT','BUTTON'].includes(e.target.tagName)) return;
  if(e.key==='Escape') closeFocus(); else if(e.key==='ArrowRight') stepFocus(1); else if(e.key==='ArrowLeft') stepFocus(-1); else if(e.code==='Space'){ e.preventDefault(); $('fplay').click(); } });

// ---------- play all ----------
const SPEEDS={count:[['1×',1],['4×',4],['16×',16],['64×',64],['256×',256]], time:[['1 s = 10 s',10],['1 s = 1 min',60],['1 s = 10 min',600],['1 s = 1 h',3600]]};
let gPlaying=false, gPos=0, sync='count';
function fillSpeeds(){ $('gspeed').innerHTML=SPEEDS[sync].map(([l,v],i)=>`<option value="${v}" ${i===(sync==='count'?2:1)?'selected':''}>${l}</option>`).join(''); }
function setGIcon(){ $('gicon').innerHTML=gPlaying?'<path d="M2.5 1.5h2.6v9H2.5zm4.4 0h2.6v9H6.9z"/>':'<path d="M2.5 1.5v9l7.5-4.5z"/>'; $('glabel').textContent=gPlaying?'Pause all':'Play all'; }
function stopGlobal(){ if(gPlaying){ gPlaying=false; setGIcon(); } }
function applyGlobal(){ for(const c of cards[tab]){ const r=c.run; let k;
    if(sync==='count') k=Math.min(r.length,Math.floor(gPos)); else { let lo=0,hi=r.length; while(lo<hi){ const m=(lo+hi)>>1; if(r[m].T<=gPos) lo=m+1; else hi=m; } k=lo; }
    if(k!==c.k){ c.k=k; c.update(); } }
  $('gclock').textContent= sync==='count'? `Measurement ${Math.floor(gPos).toLocaleString()}` : `Lab time ${fmtTime(gPos)}`;
  if(cards[tab].every(c=>c.k>=c.run.length)) stopGlobal(); }
$('gplay').onclick=()=>{ if(gPlaying){ stopGlobal(); return; }
  cards[tab].forEach(c=>{ if(c.playing){ c.playing=false; c.update(); } });
  if(gPos===0||cards[tab].every(c=>c.k>=c.run.length)) gPos=0; gPlaying=true; setGIcon(); applyGlobal(); };
$('greset').onclick=()=>{ stopGlobal(); gPos=0; cards[tab].forEach(c=>{ c.playing=false; c.k=0; c.update(); }); $('gclock').textContent=''; };
function setSync(m){ sync=m; $('sync-count').setAttribute('aria-pressed',m==='count'); $('sync-time').setAttribute('aria-pressed',m==='time'); stopGlobal(); gPos=0; fillSpeeds(); $('gclock').textContent=''; }
$('sync-count').onclick=()=>setSync('count'); $('sync-time').onclick=()=>setSync('time');

// ---------- tabs ----------
function legend(){ const pos=tab==='pos';
  $('legend').innerHTML=`<span>${pos?'20':'Low'}<i class="ramp"></i>${pos?'50.5 dB':'High'}</span><span><i class="ring"></i>Now</span><span><i class="dot"></i>Best so far</span>${pos?'<span><i class="dia"></i>True best</span>':''}`;
  $('note').textContent= pos? 'Replay: MATLAB simulation algorithms run on the measured SNR map. Replay lab times are estimates.' : 'Angle sweep SNR was not saved, so only its order is shown. Colours use each run’s own range.'; }
function showTab(t){ if(focus) closeFocus(); tab=t; stopGlobal(); gPos=0; $('gclock').textContent='';
  $('tab-pos').setAttribute('aria-selected',t==='pos'); $('tab-rot').setAttribute('aria-selected',t==='rot');
  $('grid-pos').hidden=t!=='pos'; $('grid-rot').hidden=t!=='rot';
  if(t==='rot'&&!cards.rot.length) cards.rot=ROT.map(makeRotCard);
  cards[t].forEach(c=>{ c.canvas._w=null; c.update(); }); legend(); }
$('tab-pos').onclick=()=>showTab('pos'); $('tab-rot').onclick=()=>showTab('rot');

// ---------- loop ----------
let last=performance.now();
function loop(ts){ const dt=Math.min(0.1,(ts-last)/1000); last=ts;
  if(gPlaying){ const v=Number($('gspeed').value); gPos+=dt*(sync==='count'?v*6:v); applyGlobal(); }
  for(const c of cards[tab]){
    if(c.playing){ c.acc+=dt*6*c.speed; const s=Math.floor(c.acc); if(s>0){ c.acc-=s; c.k=Math.min(c.run.length,c.k+s); if(c.k>=c.run.length) c.playing=false; c.update(); } }
    if(c.ease) c.ease();
    if(c.dirty){ c.prep(); setCam(c.camera,c.which);
      if(!focus && fit(c.renderer,c.canvas,c.camera,c.aspect)) c.renderer.render(c.scene,c.camera);
      if(focus===c && fit(frenderer,fcanvas,fcam,c.kind==='pos'?0.82:0.8)){ setCam(fcam,c.which); frenderer.render(c.scene,fcam); }
      c.dirty=false; } }
  requestAnimationFrame(loop); }
window.addEventListener('resize',()=>{ fcanvas._w=null; cards[tab].forEach(c=>{ c.canvas._w=null; c.dirty=true; if(c.kind==='rot'&&!focus) drawPlot(c.plot,c,0.95); }); if(focus) refreshFocus(); });
fillSpeeds(); cards.pos=POS.map(makePosCard); legend(); requestAnimationFrame(loop);
</script>
